# /etc/tmrp/receiver.tomlへの配置例。相対パスはこのファイルの位置が基準。
assets = "assets.json"
client_id = "tmrp-power-receiver-01"
mqtt_host = "127.0.0.1"
mqtt_port = 18884
keepalive = 30
mqtt_username = "tmrp-receiver"
tls = false
health_host = "127.0.0.1"
health_port = 8081
max_payload_bytes = 16384
# 監視クライアント用HTTPS API。MQTTのtlsとは別の設定。
api_enabled = false
api_host = "0.0.0.0"
api_port = 8443
# api_cert_file = "/etc/tmrp/tls/server.crt"
# api_key_file = "/etc/tmrp/tls/server.key"
# 外部Brokerへ接続する場合はtls=trueとし、必要に応じCA・クライアント証明書を指定。
# ca_file = "/etc/tmrp/ca.crt"
# cert_file = "/etc/tmrp/client.crt"
# key_file = "/etc/tmrp/client.key"

[api_command_targets]
# power-meter-001 = "breaker-001"
