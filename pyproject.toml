[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "TMRP"
version = "0.1.0"
description = "Telemetry Monitoring and Replay Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["loguru>=0.7.3,<0.8"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy"
]
analysis = [
    "pandas>=3.0,<4.0",
    "numpy>=2.0,<3.0",
    "jupyterlab>=4.0,<5.0",
    "ipykernel",
    "nbconvert",
    "matplotlib>=3.9,<4.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
tmrp = "myproj.cli:main"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
