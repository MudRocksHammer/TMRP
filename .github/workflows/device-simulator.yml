name: C++ Qt device simulator
on:
  workflow_dispatch:
  push:
    paths: ['device-simulator/**', 'monitor-client/**', 'src/**', 'tests/**', 'scripts/server/**', 'pyproject.toml', '.github/workflows/device-simulator.yml']
  pull_request:
    paths: ['device-simulator/**', 'monitor-client/**', 'src/**', 'tests/**', 'scripts/server/**', 'pyproject.toml', '.github/workflows/device-simulator.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: tmrp_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./device-simulator/tests/test_windows_setup.ps1
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-websockets-dev libqt6sql6-sqlite libmosquitto-dev mosquitto
      - run: cmake -S device-simulator -B device-simulator/build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build device-simulator/build --parallel 2
      - run: ctest --test-dir device-simulator/build --output-on-failure
      - run: cmake -S monitor-client -B monitor-client/build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build monitor-client/build --parallel 2
      - run: ctest --test-dir monitor-client/build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Real MQTT, database, HTTPS/WSS and Qt flow
        env:
          TMRP_TEST_DSN: host=127.0.0.1 dbname=tmrp_test user=postgres password=integration
        run: python -m pytest -q tests/units/app/test_monitor_stream.py tests/integration/collection/test_power_server_integration.py
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts with Windows PowerShell 5.1
        shell: powershell
        run: ./device-simulator/tests/test_windows_setup.ps1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true
      - shell: pwsh
        run: |
          & ./device-simulator/tests/test_windows_setup.ps1
          & ./device-simulator/scripts/setup-windows.ps1 -QtPrefix $env:QT_ROOT_DIR -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT -InstallRoot "$env:RUNNER_TEMP/tmrp-toolchains"
          & ./monitor-client/scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: device-simulator-windows-x64
          path: device-simulator/build-windows/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-client-windows-x64
          path: monitor-client/build-windows/Release/
