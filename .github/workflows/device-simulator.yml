name: C++ Qt device simulator
on:
  workflow_dispatch:
  push:
    paths: ['device-simulator/**', '.github/workflows/device-simulator.yml']
  pull_request:
    paths: ['device-simulator/**', '.github/workflows/device-simulator.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libqt6sql6-sqlite libmosquitto-dev
      - run: cmake -S device-simulator -B device-simulator/build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build device-simulator/build --parallel 2
      - run: ctest --test-dir device-simulator/build --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - shell: pwsh
        run: |
          & ./device-simulator/scripts/build-windows.ps1 -QtPrefix $env:QT_ROOT_DIR -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT
      - uses: actions/upload-artifact@v4
        with:
          name: device-simulator-windows-x64
          path: device-simulator/build-windows/Release/
